<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Bd Official - Earning Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans pb-28 overflow-y-auto transition-colors duration-300" id="body-theme">

    <div id="app" class="max-w-md mx-auto bg-slate-900/90 backdrop-blur-xl dark:bg-slate-900/90 min-h-screen relative shadow-2xl border-x border-slate-800/80 z-10 pb-10">
        
        <!-- লাইভ পেমেন্ট টিকর -->
        <div class="bg-gradient-to-r from-emerald-950/90 via-slate-900/90 to-blue-950/90 border-b border-slate-800/80 py-2 px-3 text-xs overflow-hidden relative z-20 flex items-center shadow">
            <span class="text-amber-400 font-bold mr-2 flex items-center shrink-0 z-10 bg-slate-900 pr-1"><i class="fa-solid fa-bolt mr-1 animate-pulse"></i> লাইভ পেমেন্ট:</span>
            <div class="marquee-container w-full overflow-hidden whitespace-nowrap">
                <div id="live-ticker" class="animate-marquee inline-block text-slate-300 font-mono">
                    [০১৭****১২৩৪] সফলভাবে ৫০০০ টাকা বিকাশ ডিপোজিট করেছেন &nbsp;&nbsp;|&nbsp;&nbsp; [০১৮****৫৬৭৮] সফলভাবে ২০০০ টাকা নগদ উইথড্র করেছেন
                </div>
            </div>
        </div>

        <!-- হেডার -->
        <header id="app-header" class="bg-gradient-to-r from-blue-600/90 to-indigo-600/90 backdrop-blur-md p-4 text-white flex justify-between items-center shadow-lg sticky top-0 z-30 hidden border-b border-white/10">
            <div class="flex items-center space-x-2.5">
                <div onclick="switchTab('profile')" class="bg-white/25 border border-white/30 text-white font-bold p-2 rounded-full w-10 h-10 flex items-center justify-center text-lg cursor-pointer shadow hover:bg-white/35 transition">T</div>
                <div onclick="switchTab('home')" class="cursor-pointer">
                    <span class="text-lg font-black tracking-wider text-white">Task Bd Official</span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="switchTab('notifications')" class="bg-white/20 w-9 h-9 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition shadow relative">
                    <i class="fa-solid fa-bell text-sm"></i>
                    <span id="notif-badge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden">0</span>
                </button>
                <button onclick="toggleTheme()" class="bg-white/20 w-9 h-9 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition shadow">
                    <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
                </button>
            </div>
        </header>

        <!-- মেইন ডাইনামিক কন্টেন্ট -->
        <main id="main-content" class="p-4 space-y-4">
            <!-- জাভাস্ক্রিপ্ট দিয়ে পেজ লোড হবে -->
        </main>

        <!-- নোটিফিকেশন ডিটেইল মোডাল -->
        <div id="notif-detail-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-blue-500/50 w-full max-w-sm rounded-2xl p-5 space-y-4 relative shadow-2xl">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <span class="text-xs font-bold text-emerald-400 flex items-center"><i class="fa-solid fa-envelope-open-text mr-1.5"></i> মেসেজ বিস্তারিত</span>
                    <button onclick="closeNotifDetailModal()" class="text-slate-400 hover:text-white bg-slate-800 w-7 h-7 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark text-xs"></i></button>
                </div>
                <div class="space-y-2">
                    <h4 id="notif-modal-title" class="font-bold text-base text-white">শিরোনাম</h4>
                    <p id="notif-modal-time" class="text-[10px] text-slate-400 font-mono">সময়</p>
                    <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 text-xs text-slate-200 leading-relaxed" id="notif-modal-desc"></div>
                </div>
                <button onclick="closeNotifDetailModal()" class="w-full bg-blue-600 hover:bg-blue-700 py-2.5 rounded-xl text-xs font-semibold text-white transition shadow">বন্ধ করুন</button>
            </div>
        </div>

        <!-- গল্প পড়ার মোডাল -->
        <div id="story-readmore-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-purple-500/50 w-full max-w-md rounded-2xl p-5 space-y-4 relative shadow-2xl max-h-[85vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 id="story-modal-title" class="font-bold text-sm text-purple-400">গল্পের শিরোনাম</h3>
                    <button onclick="closeStoryReadMoreModal()" class="text-slate-400 hover:text-white bg-slate-800 w-7 h-7 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark text-xs"></i></button>
                </div>
                <p id="story-modal-desc" class="text-xs text-slate-200 leading-relaxed whitespace-pre-line"></p>
                <button id="story-modal-claim-btn" class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-xl text-xs font-bold text-white transition shadow">গল্পটি পড়ে বোনাস নিন</button>
            </div>
        </div>

        <!-- অ্যানাউন্সমেন্ট পপআপ মোডাল -->
        <div id="announcement-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-blue-500/50 w-full max-w-sm rounded-2xl p-5 space-y-4 relative shadow-2xl">
                <div class="text-center space-y-2">
                    <div class="w-12 h-12 bg-blue-500/20 text-blue-400 rounded-full mx-auto flex items-center justify-center text-xl"><i class="fa-solid fa-bullhorn"></i></div>
                    <h3 class="font-bold text-base text-white">বিশেষ ঘোষণা ও অফার!</h3>
                    <p id="modal-announcement-text" class="text-xs text-slate-300 leading-relaxed"></p>
                </div>
                <button onclick="closeAnnouncementModal()" class="w-full bg-blue-600 hover:bg-blue-700 py-2.5 rounded-xl text-xs font-semibold text-white transition shadow">বুঝেছি, ধন্যবাদ</button>
            </div>
        </div>

        <!-- লাইভ সাপোর্ট চ্যাট উইজেট -->
        <div id="floating-chat-container" class="fixed bottom-20 right-4 z-50 hidden">
            <button onclick="toggleFloatingChat()" class="w-14 h-14 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full shadow-2xl flex items-center justify-center text-white text-2xl transition transform hover:scale-105 ring-4 ring-blue-500/30">
                <i class="fa-solid fa-headset"></i>
            </button>
            <div id="floating-chat-box" class="hidden absolute bottom-16 right-0 w-80 bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden flex flex-col h-96 z-50">
                <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-3 text-white flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
                        <span class="font-bold text-xs">কাস্টমার সাপোর্ট ও লাইভ চ্যাট</span>
                    </div>
                    <button onclick="toggleFloatingChat()" class="text-white hover:text-slate-200 text-sm w-7 h-7 rounded-full bg-black/20 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="floating-chat-messages" class="flex-1 p-3 overflow-y-auto space-y-2.5 text-xs bg-slate-950"></div>
                <div class="p-2.5 bg-slate-900 border-t border-slate-800 flex space-x-2">
                    <input type="text" id="floating-chat-input" onkeypress="if(event.key === 'Enter') sendFloatingChatMessage()" placeholder="আপনার সমস্যা লিখুন..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    <button onclick="sendFloatingChatMessage()" class="bg-blue-600 hover:bg-blue-700 px-3.5 py-2 rounded-xl text-white text-xs font-semibold shadow"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- বটম নেভবার -->
        <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex justify-around py-3 text-xs text-slate-400 z-30 shadow-2xl hidden">
        </nav>

    </div>

    <script src="script.js"></script>
</body>
</html>
